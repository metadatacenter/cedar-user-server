server:
  # Jetty's graceful stop waits for open connections to drain, about a second for each booted test
  # application. No test exercises the drain.
  shutdownGracePeriod: 0s
  applicationConnectors:
  - type: http
    bindHost: 127.0.0.1
  adminConnectors:
  - type: http
    bindHost: 127.0.0.1
logging:
  level: INFO
  loggers:
    org.metadatacenter: DEBUG
  appenders:
    - type: console
      threshold: ALL
      timeZone: UTC
      target: stdout
